[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "red-audio-adapter"
version = "0.1.0"
description = "Private Red-compatible Lavalink resolver, cache and optional download relay"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = "GPL-3.0-only"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "httpx>=0.28,<1"]

[project.optional-dependencies]
audio = ["yt-dlp[default]==2026.8.19"]
red = ["Red-DiscordBot==3.5.24", "pip>=25,<27"]

[project.scripts]
red-audio-resolver = "red_audio_adapter.audio_resolver:main"

[tool.hatch.build.targets.wheel]
packages = ["src/red_audio_adapter"]

[dependency-groups]
dev = ["pytest>=8,<9", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
